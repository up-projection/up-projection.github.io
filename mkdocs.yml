site_name: up_proj
site_description: Yaya's Website
site_url: https://up-projection.github.io

nav:
  - Home: index.md
  - Blog: blog/index.md
  - Research: research.md
  # - About: about.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/up-projection-logo.svg
  favicon: favicon.ico
  palette: 
    scheme: slate
    primary: black
    accent: black
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
  
  font:
    text: Inter
    code: Roboto Mono

plugins:
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_url_format: "{slug}"
      draft: false
      draft_on_serve: true
      post_readtime: false
      post_excerpt: optional
      archive: false
      categories: false
      authors: false
      pagination: false
      enabled: true

extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/yaya-sy
    name: Soynade on GitHub

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: false

# Custom charcoal and sage theme with polygon logo
extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
